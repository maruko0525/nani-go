<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>で、何語？</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f8fc;color:#13233f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:640px;margin:auto;padding:18px}.card{background:#fff;border-radius:24px;padding:22px;margin:12px 0;box-shadow:0 10px 30px #17365d12}.hide{display:none}h1{text-align:center;color:#102b55;font-size:38px}.logo{text-align:center;font-size:64px}.btn{width:100%;border:0;border-radius:16px;padding:16px;margin-top:11px;font-size:17px;font-weight:800;background:#1677ff;color:#fff}.soft{background:#eef6ff;color:#075dcc;text-align:left}.mut{color:#6b7b90}textarea,.search{width:100%;border:1px solid #dbe6f2;border-radius:16px;padding:14px;font:inherit;font-size:17px}textarea{min-height:130px}.langs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.lang{border:1px solid #dbe6f2;background:#fff;border-radius:15px;padding:12px 8px;text-align:left}.flag{font-size:24px}.ja{display:block;color:#6b7b90;font-size:12px;margin-left:32px}.pill{display:inline-block;background:#eaf3ff;color:#075dcc;border-radius:999px;padding:7px 11px;font-weight:800}.original{background:#f8fbff;border-left:4px solid #9abff1;padding:12px;margin:13px 0}.foreign{font-size:24px;line-height:1.5;border:1px solid #dbe6f2;background:#f8fbff;border-radius:17px;padding:18px}.choice{font-size:18px;line-height:1.4}.choice small{display:block;color:#68788d;font-size:12px;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.back{background:#fff;color:#1677ff;border:1px solid #b8d1f3}.center{text-align:center}
</style></head><body><main class="app">
<section id="home"><div class="card center"><div class="logo">🌍💬</div><h1>で、何語？</h1><b>NANI-GO</b><p class="mut">相手の言葉がわからなくても、<br>伝えたいことから始めよう。</p><button class="btn" onclick="go('compose')">はじめる</button></div></section>
<section id="compose" class="hide"><div class="card"><h2>① 伝えたいことを入力</h2><textarea id="src">この電車は大阪駅には行きません。次の駅で乗り換えてください。</textarea><button class="btn" onclick="go('langs')">相手に見せる</button></div></section>
<section id="langs" class="hide"><div class="card"><h2>② 読める言語を選んでください</h2><b>Please choose your language. 🌏</b><p class="mut">国旗・言語名・日本語名から選べます。</p><input class="search" id="q" placeholder="言語を検索 / Search" oninput="render()"><div style="height:12px"></div><div class="langs" id="grid"></div></div></section>
<section id="message" class="hide"><div class="card"><span class="pill" id="badge"></span><h2>相手に見せている内容</h2><div class="original"><small>日本語（あなたが入力した内容）</small><br><span id="orig"></span></div><p class="mut">▼ 相手の言語で表示</p><div class="foreign" id="foreign"></div><button class="btn soft choice" id="bye" onclick="finish()"></button><button class="btn soft choice" id="talk" onclick="method()"></button></div></section>
<section id="method" class="hide"><div class="card"><span class="pill" id="mb"></span><h2 id="mh"></h2><p class="mut">日本語：相手は「聞きたい・伝えたいことがある」を選びました。</p><div class="two"><button class="btn" id="speak" onclick="voice()"></button><button class="btn" id="type" onclick="typing()"></button></div></div></section>
<section id="typing" class="hide"><div class="card"><span class="pill" id="tb"></span><h2 id="th"></h2><p class="mut">このスマホを相手に渡して入力してもらいます。</p><textarea id="reply"></textarea><button class="btn" onclick="typed()">返信する</button></div></section>
<section id="owner" class="hide"><div class="card"><span class="pill">相手 → 日本語</span><h2>相手からの返事</h2><div id="ownerReply" style="font-size:24px;font-weight:700"></div><button class="btn" onclick="go('compose')">返事をする</button><button class="btn back" onclick="go('home')">会話を終わる</button></div></section>
<section id="done" class="hide"><div class="card center"><div style="font-size:55px">👋</div><h2>会話を終了しました</h2><p>相手は内容を理解し、感謝して会話を終了しました。</p><p class="mut" id="doneText"></p><button class="btn" onclick="go('home')">最初に戻る</button></div></section>
<script>
const L=[
['🇺🇸','English','英語','Got it, thank you. Take care!','I’d like to ask or tell you something.','Speak','Type'],
['🇨🇳','中文','中国語','明白了，谢谢！祝您一切顺利！','我还有想问或想说的事情。','说话','输入文字'],
['🇰🇷','한국어','韓国語','알겠습니다. 감사합니다. 좋은 하루 보내세요!','묻거나 전하고 싶은 말이 있어요.','말하기','입력하기'],
['🇪🇸','Español','スペイン語','Entendido, muchas gracias. ¡Que le vaya bien!','Quisiera preguntar o decir algo más.','Hablar','Escribir'],
['🇫🇷','Français','フランス語','Compris, merci beaucoup. Bonne continuation !','J’aimerais demander ou dire quelque chose.','Parler','Écrire'],
['🇵🇹','Português','ポルトガル語','Entendi, muito obrigado. Tudo de bom!','Gostaria de perguntar ou dizer algo.','Falar','Escrever'],
['🇩🇪','Deutsch','ドイツ語','Verstanden, vielen Dank. Alles Gute!','Ich möchte noch etwas fragen oder sagen.','Sprechen','Tippen'],
['🇮🇹','Italiano','イタリア語','Ho capito, grazie mille. Buona giornata!','Vorrei chiedere o dire qualcosa.','Parlare','Scrivere'],
['🇻🇳','Tiếng Việt','ベトナム語','Tôi hiểu rồi, cảm ơn bạn. Chúc bạn mọi điều tốt đẹp!','Tôi muốn hỏi hoặc nói thêm điều gì đó.','Nói','Nhập'],
['🇹🇭','ภาษาไทย','タイ語','เข้าใจแล้ว ขอบคุณมาก ขอให้โชคดี!','ฉันมีเรื่องอยากถามหรืออยากบอกเพิ่มเติม','พูด','พิมพ์'],
['🇮🇩','Bahasa Indonesia','インドネシア語','Saya mengerti, terima kasih. Semoga harimu menyenangkan!','Saya ingin bertanya atau menyampaikan sesuatu.','Bicara','Ketik'],
['🇵🇭','Filipino','フィリピノ語','Naiintindihan ko, salamat. Ingat ka!','May gusto pa akong itanong o sabihin.','Magsalita','Mag-type'],
['🇮🇳','हिन्दी','ヒンディー語','समझ गया/गई, बहुत धन्यवाद। आपका दिन शुभ हो!','मैं कुछ पूछना या कहना चाहता/चाहती हूँ।','बोलें','टाइप करें'],
['🇸🇦','العربية','アラビア語','فهمت، شكرًا جزيلاً. أتمنى لك كل الخير!','أود أن أسأل أو أقول شيئًا.','تحدث','اكتب'],
['🇷🇺','Русский','ロシア語','Понятно, большое спасибо. Всего доброго!','Я хочу кое-что спросить или сказать.','Говорить','Написать'],
['🇺🇦','Українська','ウクライナ語','Зрозуміло, щиро дякую. Усього доброго!','Я хочу ще дещо запитати або сказати.','Говорити','Написати'],
['🇳🇱','Nederlands','オランダ語','Begrepen, hartelijk dank. Het beste!','Ik wil graag nog iets vragen of zeggen.','Spreken','Typen'],
['🇹🇷','Türkçe','トルコ語','Anladım, çok teşekkür ederim. Hoşça kalın!','Bir şey sormak veya söylemek istiyorum.','Konuş','Yaz'],
['🇵🇱','Polski','ポーランド語','Rozumiem, bardzo dziękuję. Wszystkiego dobrego!','Chcę jeszcze o coś zapytać lub coś powiedzieć.','Mów','Pisz'],
['🇲🇾','Bahasa Melayu','マレー語','Saya faham, terima kasih banyak. Semoga baik-baik selalu!','Saya ingin bertanya atau mengatakan sesuatu.','Bercakap','Taip']
];let cur;
const screens=['home','compose','langs','message','method','typing','owner','done'];
function go(x){screens.forEach(s=>document.getElementById(s).classList.toggle('hide',s!==x));if(x==='langs')render();scrollTo(0,0)}
function render(){let s=(q.value||'').toLowerCase();grid.innerHTML='';L.filter(x=>(x[1]+x[2]).toLowerCase().includes(s)).forEach(x=>{let b=document.createElement('button');b.className='lang';b.innerHTML='<span class=flag>'+x[0]+'</span> <b>'+x[1]+'</b><span class=ja>'+x[2]+'</span>';b.onclick=()=>select(x);grid.appendChild(b)})}
function select(x){cur=x;badge.textContent=x[0]+' '+x[1]+'｜'+x[2];orig.textContent=src.value;foreign.textContent='【試作翻訳】'+src.value;bye.innerHTML='👋 <b>'+x[3]+'</b><small>日本語：理解・感謝して、ここで会話を終える</small>';talk.innerHTML='💬 <b>'+x[4]+'</b><small>日本語：聞きたい・伝えたいことがある → 会話を始める</small>';go('message')}
function finish(){doneText.textContent=cur[3];go('done')}
function method(){mb.textContent=cur[0]+' '+cur[1]+'｜'+cur[2];mh.textContent=cur[4];speak.textContent='🎙 '+cur[5];type.textContent='⌨️ '+cur[6];go('method')}
function voice(){ownerReply.textContent='【試作】ここで'+cur[2]+'の音声を認識し、日本語へ翻訳します。';go('owner')}
function typing(){tb.textContent=cur[0]+' '+cur[1]+'｜'+cur[2];th.textContent=cur[6];reply.value='';go('typing')}
function typed(){ownerReply.textContent=reply.value?'【試作】相手の入力：「'+reply.value+'」→ 本番では日本語訳を表示します。':'入力がありません。';go('owner')}render();
</script></main></body></html>
