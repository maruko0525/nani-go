<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>で、何語？</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8fc;color:#13233f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:640px;margin:auto;padding:18px}.card{background:#fff;border-radius:24px;padding:22px;margin:12px 0;box-shadow:0 10px 30px #17365d12}.hide{display:none}h1{text-align:center;color:#102b55;font-size:38px}.logo{text-align:center;font-size:64px}.center{text-align:center}.mut{color:#6b7b90}.btn{width:100%;border:0;border-radius:16px;padding:16px;margin-top:11px;font-size:17px;font-weight:800;background:#1677ff;color:#fff}.soft{background:#eef6ff;color:#075dcc;text-align:left}.back{background:#fff;color:#1677ff;border:1px solid #b8d1f3}textarea,.search{width:100%;border:1px solid #dbe6f2;border-radius:16px;padding:14px;font:inherit;font-size:17px}textarea{min-height:135px}.langs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.lang{border:1px solid #dbe6f2;background:#fff;border-radius:15px;padding:12px 8px;text-align:left}.flag{font-size:24px}.ja{display:block;color:#6b7b90;font-size:12px;margin-left:32px}.pill{display:inline-block;background:#eaf3ff;color:#075dcc;border-radius:999px;padding:7px 11px;font-weight:800}.original{background:#f8fbff;border-left:4px solid #9abff1;padding:12px;margin:13px 0}.foreign{font-size:24px;line-height:1.55;border:1px solid #dbe6f2;background:#f8fbff;border-radius:17px;padding:18px;white-space:pre-wrap}.choice{font-size:18px}.choice small{display:block;color:#68788d;font-size:12px;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class=app>
<section id=home><div class="card center"><div class=logo>🌍💬</div><h1>で、何語？</h1><b>NANI-GO</b><p class=mut>相手の言葉がわからなくても、<br>伝えたいことから始めよう。</p><button class=btn onclick="go('compose')">はじめる</button></div></section>
<section id=compose class=hide><div class=card><h2>① 伝えたいことを入力</h2><textarea id=src placeholder="日本語で入力"></textarea><button class=btn onclick="go('langs')">次へ</button></div></section>
<section id=langs class=hide><div class=card><h2>② 読める言語を選んでください</h2><b>Please choose your language. 🌏</b><p class=mut>相手にこの画面を見せて選んでもらいます。</p><input id=q class=search placeholder="言語を検索 / Search" oninput=render()><div style="height:12px"></div><div id=grid class=langs></div></div></section>
<section id=loading class=hide><div class="card center"><h2>🌍 翻訳しています…</h2><p id=loadText class=mut></p></div></section>
<section id=message class=hide><div class=card><span id=badge class=pill></span><h2>相手に見せている内容</h2><div class=original><small>日本語（あなたが入力した内容）</small><br><span id=orig></span></div><p class=mut>▼ 相手の言語で表示</p><div id=foreign class=foreign></div><button id=bye class="btn soft choice" onclick=finish()></button><button id=talk class="btn soft choice" onclick=method()></button></div></section>
<section id=method class=hide><div class=card><span id=mb class=pill></span><h2 id=mh></h2><p class=mut>日本語：相手は会話を希望しています。</p><div class=two><button id=speak class=btn onclick=voice()></button><button id=type class=btn onclick=typing()></button></div></div></section>
<section id=typing class=hide><div class=card><span id=tb class=pill></span><h2>相手の言葉で入力</h2><textarea id=reply></textarea><button class=btn onclick=translateReply()>日本語にして返す</button></div></section>
<section id=owner class=hide><div class=card><span class=pill>相手 → 日本語</span><h2>相手からの返事</h2><div id=ownerReply class=foreign></div><button class=btn onclick="go('compose')">返事をする</button><button class="btn back" onclick="go('home')">会話を終わる</button></div></section>
<section id=done class=hide><div class="card center"><h2>👋 会話を終了しました</h2><p id=doneText class=mut></p><button class=btn onclick="go('home')">最初に戻る</button></div></section>
<section id=err class=hide><div class=card><h2>接続エラー</h2><p id=errText></p><button class="btn back" onclick="go('compose')">戻る</button></div></section>
<script>
const WORKER_URL="PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE";
const L=[['🇺🇸','English','英語'],['🇨🇳','Chinese (Simplified)','中国語（簡体字）'],['🇹🇼','Chinese (Traditional)','中国語（繁体字）'],['🇰🇷','Korean','韓国語'],['🇪🇸','Spanish','スペイン語'],['🇫🇷','French','フランス語'],['🇵🇹','Portuguese','ポルトガル語'],['🇩🇪','German','ドイツ語'],['🇮🇹','Italian','イタリア語'],['🇻🇳','Vietnamese','ベトナム語'],['🇹🇭','Thai','タイ語'],['🇮🇩','Indonesian','インドネシア語'],['🇵🇭','Filipino','フィリピノ語'],['🇮🇳','Hindi','ヒンディー語'],['🇸🇦','Arabic','アラビア語'],['🇷🇺','Russian','ロシア語'],['🇺🇦','Ukrainian','ウクライナ語'],['🇳🇱','Dutch','オランダ語'],['🇹🇷','Turkish','トルコ語'],['🇵🇱','Polish','ポーランド語'],['🇲🇾','Malay','マレー語']];let cur;const S=['home','compose','langs','loading','message','method','typing','owner','done','err'];
function go(x){S.forEach(s=>document.getElementById(s).classList.toggle('hide',s!==x));if(x==='langs')render();scrollTo(0,0)}
function render(){let s=(q.value||'').toLowerCase();grid.innerHTML='';L.filter(x=>(x[1]+x[2]).toLowerCase().includes(s)).forEach(x=>{let b=document.createElement('button');b.className='lang';b.innerHTML='<span class=flag>'+x[0]+'</span> <b>'+x[1]+'</b><span class=ja>'+x[2]+'</span>';b.onclick=()=>select(x);grid.appendChild(b)})}
async function api(text,from,to){if(WORKER_URL.startsWith('PASTE_'))throw Error('Worker URLが未設定です');let r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,sourceLanguage:from,targetLanguage:to})});let j=await r.json();if(!r.ok||!j.translation)throw Error(j.error||'翻訳失敗');return j.translation}
async function select(x){cur=x;let t=src.value.trim();if(!t){go('compose');return}loadText.textContent='日本語 → '+x[2];go('loading');try{let z=await api(t,'Japanese',x[1]);badge.textContent=x[0]+' '+x[1]+'｜'+x[2];orig.textContent=t;foreign.textContent=z;let a=await api('わかりました。ありがとうございます。それでは、またいつか。','Japanese',x[1]);let b=await api('聞きたいこと、または伝えたいことがあります。','Japanese',x[1]);bye.innerHTML='👋 <b>'+a+'</b><small>日本語：理解・感謝して会話を終える</small>';talk.innerHTML='💬 <b>'+b+'</b><small>日本語：聞きたい・伝えたいことがある → 会話を始める</small>';cur.push(a,b);go('message')}catch(e){errText.textContent=e.message;go('err')}}
function finish(){doneText.textContent=cur[3];go('done')}function method(){mb.textContent=cur[0]+' '+cur[1]+'｜'+cur[2];mh.textContent=cur[4];speak.textContent='🎙 話す';type.textContent='⌨️ 入力する';go('method')}function voice(){alert('音声認識は次段階で接続します')}function typing(){tb.textContent=cur[0]+' '+cur[1]+'｜'+cur[2];reply.value='';go('typing')}
async function translateReply(){let t=reply.value.trim();if(!t)return;loadText.textContent=cur[2]+' → 日本語';go('loading');try{ownerReply.textContent=await api(t,cur[1],'Japanese');go('owner')}catch(e){errText.textContent=e.message;go('err')}}render();
</script></main></body></html>
